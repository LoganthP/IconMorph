name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, args: "--target x86_64-pc-windows-msvc", target: x86_64-pc-windows-msvc }
          - { name: windows-arm64, os: windows-latest, args: "--target aarch64-pc-windows-msvc --bundles nsis", target: aarch64-pc-windows-msvc }
          - { name: macos-arm64, os: macos-latest, args: "--target aarch64-apple-darwin", target: aarch64-apple-darwin }
          - { name: macos-x64, os: macos-latest, args: "--target x86_64-apple-darwin", target: x86_64-apple-darwin }
          - { name: linux-x64, os: ubuntu-22.04, args: "", target: "" }
          - { name: linux-arm64, os: ubuntu-22.04-arm, args: "", target: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev rpm
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Signing/notarisation is used only when these secrets exist; development builds are unsigned.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: IconMorph ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md. Installers are unsigned unless noted; see README → Installing.
          releaseDraft: true
          args: ${{ matrix.args }}

  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: SHA-256 checksums for every release asset
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          mkdir assets && cd assets
          gh release download "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY"
          sha256sum * > SHA256SUMS.txt
          gh release upload "${GITHUB_REF_NAME}" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
