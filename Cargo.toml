[workspace]
resolver = "2"
members = ["crates/iconmorph-core", "src-tauri"]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/LoganthP/IconMorph"
rust-version = "1.89"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Image code is unusably slow unoptimised; keep our crates debuggable but optimise deps.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.iconmorph-core]
opt-level = 1
