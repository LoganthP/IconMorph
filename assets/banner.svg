<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="iconmorph. Little icons. Infinite personalities.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2620"/>
      <stop offset="0.6" stop-color="#26362d"/>
      <stop offset="1" stop-color="#3a2d33"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#B7C9B2"/>
      <stop offset="0.5" stop-color="#F7F5EF"/>
      <stop offset="1" stop-color="#E8A68C"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.5 0;0.5 0;-0.5 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#B7C9B2" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#B7C9B2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E8A68C" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#E8A68C" stop-opacity="0"/>
    </radialGradient>
    <path id="b" d="M58 58 C50 40 50 24 56 14 C68 20 84 34 92 50 L108 50 C116 34 132 20 144 14 C150 24 150 40 142 58
                    C162 64 174 82 174 106 L174 136 C174 162 156 180 130 180 L70 180 C44 180 26 162 26 136 L26 106 C26 82 38 64 58 58 Z"/>
    <clipPath id="l"><path d="M0 0 H96 C86 70 120 120 100 200 H0 Z"/></clipPath>
    <clipPath id="r"><path d="M96 0 C86 70 120 120 100 200 H200 V0 Z"/></clipPath>
  </defs>

  <rect width="1200" height="340" rx="22" fill="url(#bg)"/>
  <ellipse cx="190" cy="170" rx="260" ry="170" fill="url(#glowL)">
    <animate attributeName="rx" values="240;290;240" dur="7s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="1010" cy="170" rx="260" ry="170" fill="url(#glowR)">
    <animate attributeName="rx" values="290;240;290" dur="7s" repeatCount="indefinite"/>
  </ellipse>

  <!-- floating sparkles -->
  <g fill="#F7F5EF">
    <circle cx="470" cy="60" r="2.4"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="48" r="2"><animate attributeName="opacity" values="0.9;0.1;0.9" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="690" cy="292" r="2.6"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="3.6s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="288" r="2"><animate attributeName="opacity" values="0.8;0.1;0.8" dur="4.4s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="110" r="2.2"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="5s" begin="1.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- brand mark (Morphling) -->
  <g transform="translate(72 70) scale(1.0)">
    <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 -8;0 0" dur="4.5s" repeatCount="indefinite"/>
    <use href="#b" fill="#B7C9B2" clip-path="url(#l)"/>
    <use href="#b" fill="#E8A68C" clip-path="url(#r)"/>
    <ellipse cx="76" cy="118" rx="10" ry="10" fill="#293B32"><animate attributeName="ry" values="10;10;1;10;10" keyTimes="0;0.44;0.47;0.5;1" dur="5s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="126" cy="118" rx="10" ry="10" fill="#293B32"><animate attributeName="ry" values="10;10;1;10;10" keyTimes="0;0.44;0.47;0.5;1" dur="5s" repeatCount="indefinite"/></ellipse>
    <circle cx="79" cy="114" r="3" fill="#F7F5EF"/>
    <circle cx="129" cy="114" r="3" fill="#F7F5EF"/>
    <path d="M92 140 Q101 149 110 140" stroke="#293B32" stroke-width="6" fill="none" stroke-linecap="round"/>
    <ellipse cx="58" cy="140" rx="10" ry="6" fill="#E3C1D6" opacity=".9"/>
    <ellipse cx="146" cy="140" rx="10" ry="6" fill="#E3C1D6" opacity=".9"/>
  </g>

  <!-- wordmark -->
  <text x="300" y="172" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="84" font-weight="800" letter-spacing="-2" fill="url(#shine)">iconmorph<tspan fill="#E8A68C">.</tspan></text>
  <text x="304" y="218" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="27" font-weight="500" fill="#B7C9B2">Little icons. Infinite personalities.</text>
  <text x="304" y="256" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#F7F5EF" fill-opacity="0.7">Folder &amp; shortcut icons  ·  Windows  ·  macOS  ·  Linux  ·  Tauri + Rust</text>

  <!-- morphing tile: folder -> cat -> morphling -->
  <g transform="translate(940 78)">
    <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 6;0 0" dur="4.5s" begin="0.6s" repeatCount="indefinite"/>
    <rect x="-8" y="-8" width="196" height="196" rx="40" fill="#F7F5EF" fill-opacity="0.06" stroke="#F7F5EF" stroke-opacity="0.18" stroke-dasharray="4 8">
      <animate attributeName="stroke-dashoffset" values="0;-96" dur="8s" repeatCount="indefinite"/>
    </rect>

    <!-- A: plain folder -->
    <g>
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.30;0.333;0.967;1" dur="9s" repeatCount="indefinite"/>
      <path d="M14 58 h54 l16 18 h84 a14 14 0 0 1 14 14 v62 a14 14 0 0 1 -14 14 H14 a14 14 0 0 1 -14 -14 V72 a14 14 0 0 1 14 -14z" transform="translate(0 -6)" fill="#E3C98B"/>
      <path d="M0 94 h180 v46 a14 14 0 0 1 -14 14 H14 a14 14 0 0 1 -14 -14z" transform="translate(0 0)" fill="#F0D99F"/>
    </g>

    <!-- B: cat character -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.333;0.366;0.63;0.666;1" dur="9s" repeatCount="indefinite"/>
      <path d="M30 70 L34 20 L74 48 Q90 44 106 48 L146 20 L150 70 Q168 90 168 118 Q168 166 90 166 Q12 166 12 118 Q12 90 30 70Z" fill="#E8A68C"/>
      <path d="M40 62 L42 36 L62 52Z M140 62 L138 36 L118 52Z" fill="#E3C1D6"/>
      <circle cx="64" cy="108" r="9" fill="#293B32"/><circle cx="116" cy="108" r="9" fill="#293B32"/>
      <circle cx="67" cy="105" r="3" fill="#F7F5EF"/><circle cx="119" cy="105" r="3" fill="#F7F5EF"/>
      <path d="M82 128 Q90 136 98 128" stroke="#293B32" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M20 122 H48 M20 134 H46 M160 122 H132 M160 134 H134" stroke="#293B32" stroke-width="3" stroke-linecap="round" opacity=".6"/>
    </g>

    <!-- C: morphling -->
    <g opacity="0" transform="scale(0.9)">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.666;0.70;0.963;1" dur="9s" repeatCount="indefinite"/>
      <use href="#b" fill="#B7C9B2" clip-path="url(#l)"/>
      <use href="#b" fill="#E8A68C" clip-path="url(#r)"/>
      <circle cx="76" cy="118" r="10" fill="#293B32"/><circle cx="126" cy="118" r="10" fill="#293B32"/>
      <circle cx="79" cy="114" r="3" fill="#F7F5EF"/><circle cx="129" cy="114" r="3" fill="#F7F5EF"/>
      <path d="M92 140 Q101 149 110 140" stroke="#293B32" stroke-width="6" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <!-- progress dots under the tile -->
  <g transform="translate(1000 280)" fill="#F7F5EF">
    <circle cx="0" cy="0" r="4"><animate attributeName="fill-opacity" values="1;1;0.25;0.25;1" keyTimes="0;0.30;0.333;0.967;1" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="20" cy="0" r="4" fill-opacity="0.25"><animate attributeName="fill-opacity" values="0.25;0.25;1;1;0.25;0.25" keyTimes="0;0.333;0.366;0.63;0.666;1" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="40" cy="0" r="4" fill-opacity="0.25"><animate attributeName="fill-opacity" values="0.25;0.25;1;1;0.25" keyTimes="0;0.666;0.70;0.963;1" dur="9s" repeatCount="indefinite"/></circle>
  </g>
</svg>
