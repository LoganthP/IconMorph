<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190" role="img" aria-label="Pick, Morph, Preview, Apply, Verify, Done">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2620"/>
      <stop offset="1" stop-color="#2a2f2b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="190" rx="18" fill="url(#bg)"/>

  <!-- rail -->
  <line x1="100" y1="82" x2="1100" y2="82" stroke="#F7F5EF" stroke-opacity="0.16" stroke-width="2"/>
  <line x1="100" y1="82" x2="1100" y2="82" stroke="#E8A68C" stroke-width="3" stroke-linecap="round" stroke-dasharray="14 986">
    <animate attributeName="stroke-dashoffset" values="14;-1000" dur="5s" repeatCount="indefinite"/>
  </line>

  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" text-anchor="middle">
    <g>
      <circle cx="100" cy="82" r="30" fill="#B7C9B2"/>
      <text x="100" y="91" font-size="26" font-weight="800" fill="#1a2620">1</text>
      <text x="100" y="140" font-size="17" font-weight="700" fill="#F7F5EF">Pick</text>
      <text x="100" y="161" font-size="13" fill="#B7C9B2">folder or shortcut</text>
    </g>
    <g>
      <circle cx="300" cy="82" r="30" fill="#E3C1D6"/>
      <text x="300" y="91" font-size="26" font-weight="800" fill="#1a2620">2</text>
      <text x="300" y="140" font-size="17" font-weight="700" fill="#F7F5EF">Morph</text>
      <text x="300" y="161" font-size="13" fill="#B7C9B2">6 modes · Studio</text>
    </g>
    <g>
      <circle cx="500" cy="82" r="30" fill="#E8A68C"/>
      <text x="500" y="91" font-size="26" font-weight="800" fill="#1a2620">3</text>
      <text x="500" y="140" font-size="17" font-weight="700" fill="#F7F5EF">Preview</text>
      <text x="500" y="161" font-size="13" fill="#B7C9B2">same engine, 1:1 pixels</text>
    </g>
    <g>
      <circle cx="700" cy="82" r="30" fill="#B7C9B2"/>
      <text x="700" y="91" font-size="26" font-weight="800" fill="#1a2620">4</text>
      <text x="700" y="140" font-size="17" font-weight="700" fill="#F7F5EF">Apply</text>
      <text x="700" y="161" font-size="13" fill="#B7C9B2">native OS metadata</text>
    </g>
    <g>
      <circle cx="900" cy="82" r="30" fill="#E3C1D6"/>
      <text x="900" y="91" font-size="26" font-weight="800" fill="#1a2620">5</text>
      <text x="900" y="140" font-size="17" font-weight="700" fill="#F7F5EF">Verify</text>
      <text x="900" y="161" font-size="13" fill="#B7C9B2">re-read, else roll back</text>
    </g>
    <g>
      <circle cx="1100" cy="82" r="30" fill="#E8A68C"/>
      <text x="1100" y="91" font-size="26" font-weight="800" fill="#1a2620">6</text>
      <text x="1100" y="140" font-size="17" font-weight="700" fill="#F7F5EF">Done</text>
      <text x="1100" y="161" font-size="13" fill="#B7C9B2">close the app, icon stays</text>
    </g>
  </g>

  <!-- pulsing halos -->
  <g fill="none" stroke="#F7F5EF" stroke-opacity="0.5">
    <circle cx="100" cy="82" r="30"><animate attributeName="r" values="30;44" dur="5s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.5;0" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="82" r="30"><animate attributeName="r" values="30;44" dur="5s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.5;0" dur="5s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="82" r="30"><animate attributeName="r" values="30;44" dur="5s" begin="1.6s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.5;0" dur="5s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="82" r="30"><animate attributeName="r" values="30;44" dur="5s" begin="2.4s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.5;0" dur="5s" begin="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="82" r="30"><animate attributeName="r" values="30;44" dur="5s" begin="3.2s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.5;0" dur="5s" begin="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="1100" cy="82" r="30"><animate attributeName="r" values="30;44" dur="5s" begin="4s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.5;0" dur="5s" begin="4s" repeatCount="indefinite"/></circle>
  </g>
</svg>
